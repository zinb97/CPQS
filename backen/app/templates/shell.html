{% extends "base.html" %}

{% block content %}
<div class="shell-page">
  <iframe class="shell-page__iframe"
          src="{{ iframe_url }}"
          sandbox="{{ sandbox }}"
          allowfullscreen></iframe>
</div>

<style>
  .shell-page {
    width: 100%;
    height: 100%;
    background: #0a0e17;
  }
  .shell-page__iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
{% endblock %}
